name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # TODO: replace PROXY_BASE once the Cloudflare Worker is deployed —
      # see cloudflare-worker/README.md. Until then the live site can load
      # but Browse/Studios/Monitor won't be able to fetch data.
      - run: |
          flutter build web --release \
            --base-href /My-Steam-Buddy/ \
            --dart-define=PROXY_BASE=https://mysteambuddy-proxy.example.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
